[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "teflow"
version = "2.3.0"
description = "GEO batch TE analysis through a shared CLI and terminal interface"
authors = [{name = "DeeJ6126", email = "1498607332@qq.com"}]
requires-python = ">=3.12"
dependencies = ["textual==6.12.0", "PyYAML>=6", "pandas>=2", "snakemake==9.27.0", "psutil>=5.9"]

[project.scripts]
teflow = "teflow.cli:main"
tf = "teflow.cli:shortcut_main"

[tool.setuptools.packages.find]
include = ["teflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
